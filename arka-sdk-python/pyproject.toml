[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arka-sdk"
version = "0.1.0"
description = "Python SDK for building PACT Protocol domain plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "PACT Team", email = "team@pact-protocol.org" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Accounting",
]
keywords = ["pact", "compliance", "regulatory", "plugin", "sdk"]
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/pact-engine/arka-sdk-python"
Documentation = "https://docs.pact-protocol.org/sdks/python"
Repository = "https://github.com/pact-engine/arka-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["arka_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
