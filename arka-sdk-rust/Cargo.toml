[package]
name = "pact-sdk"
version = "0.1.0"
edition = "2021"
authors = ["PACT Team <team@pact-protocol.org>"]
description = "Rust SDK for building PACT Protocol domain plugins"
license = "MIT"
repository = "https://github.com/pact-engine/pact-sdk-rust"
documentation = "https://docs.pact-protocol.org/sdks/rust"
keywords = ["pact", "compliance", "regulatory", "plugin", "sdk"]
categories = ["development-tools", "api-bindings"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
async-trait = "0.1"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
lazy_static = "1.4"
tonic = { version = "0.10", optional = true }
prost = { version = "0.12", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
grpc = ["tonic", "prost"]

[lib]
name = "pact_sdk"
path = "src/lib.rs"
